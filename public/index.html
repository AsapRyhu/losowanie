<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geszynki</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(ellipse at top, #14532d 0%, #0b2a1a 60%, #071a10 100%);
    min-height: 100vh;
    color: #fdf6e3;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  h1, .title { font-family: 'Playfair Display', serif; }
  .card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(245, 197, 66, 0.35);
    border-radius: 1.5rem;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
  }
  .gold {
    background: linear-gradient(135deg, #f5c542, #d99a1a);
    color: #2b1e00;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .gold:hover { filter: brightness(1.06); }
  .gold:active { transform: scale(0.98); }
  .red {
    background: linear-gradient(135deg, #d62839, #9d1424);
    color: #fff;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .red:hover { filter: brightness(1.08); }
  .red:active { transform: scale(0.98); }
  .field {
    background: rgba(0, 0, 0, 0.4);
    border: 1.5px solid rgba(245, 197, 66, 0.4);
    color: #fff;
    border-radius: 0.9rem;
    padding: 0.9rem 1.15rem;
    width: 100%;
    font-size: 1rem;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field::placeholder { color: rgba(253, 246, 227, 0.45); }
  .field:focus {
    border-color: #f5c542;
    box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.2);
  }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-12deg) scale(1.05); }
    40% { transform: rotate(12deg) scale(1.1); }
    60% { transform: rotate(-10deg) scale(1.15); }
    80% { transform: rotate(10deg) scale(1.2); }
  }
  @keyframes pop {
    0% { transform: scale(0.2); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .shake { animation: shake 0.9s ease-in-out; }
  .pop { animation: pop 0.8s ease-out; }
</style>
</head>
<body>
<main class="relative z-10 w-full max-w-md mx-auto px-5 py-8">
  <h1 class="title text-3xl sm:text-4xl text-center text-amber-300 mb-2">🎄 Losujemy Geszynki 🎄</h1>
  <p class="text-center text-sm opacity-80 mb-7">Świąteczne losowanie prezentów</p>

  <section id="login" class="card p-6 sm:p-8 space-y-5">
    <div class="space-y-2">
      <label for="who" class="block text-sm font-medium text-amber-100/90">Kim jesteś?</label>
      <input id="who" class="field" type="text" placeholder="Wpisz swoje imię..." autocomplete="off" autocapitalize="words" spellcheck="false">
    </div>

    <div class="space-y-2">
      <label for="pin" class="block text-sm font-medium text-amber-100/90">PIN (4 cyfry)</label>
      <input id="pin" class="field tracking-widest" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    </div>

    <p id="lerr" class="text-red-300 text-sm min-h-[1.25rem] text-center font-medium"></p>
    <button id="lbtn" class="gold w-full py-3.5 rounded-xl font-semibold text-base shadow-lg">Wejdź</button>
  </section>

  <div id="app" class="hidden space-y-5">
    <div class="flex justify-between items-center px-1">
      <p class="text-base">Cześć, <b id="hi" class="text-amber-300"></b>! 👋</p>
      <button id="out" class="text-xs underline opacity-75 hover:opacity-100">Wyloguj</button>
    </div>

    <section class="card p-6 space-y-3">
      <h2 class="title text-xl text-amber-300">🎁 Co na geszynk <span class="text-xs font-sans font-normal opacity-70">(opcjonalne)</span></h2>
      <textarea id="wish" class="field resize-y" rows="3" maxlength="600" placeholder="Wpisz swoje życzenie albo chociaż nakieruj oponenta xd"></textarea>
      <div class="flex items-center gap-3 pt-1">
        <button id="wbtn" class="gold px-6 py-2.5 rounded-xl font-semibold text-sm shadow">Zapisz</button>
        <span id="wok" class="text-sm text-green-300 font-medium"></span>
      </div>
    </section>

    <section class="card p-6 text-center">
      <h2 class="title text-xl text-amber-300 mb-4">🎅 Moje losowanie</h2>
      <div id="before" class="py-2">
        <div id="gift" class="text-8xl select-none mb-5">🎁</div>
        <button id="draw" class="red w-full py-4 rounded-2xl text-lg font-semibold shadow-lg">Wylosuj osobę</button>
      </div>
      <div id="after" class="hidden">
        <p class="text-sm opacity-80">Twoja osoba do obdarowania:</p>
        <p id="tname" class="title text-4xl text-amber-300 my-3"></p>
        <div class="bg-black/35 border border-amber-400/20 rounded-xl p-4 text-left mt-3">
          <p class="text-xs opacity-70 mb-1.5 uppercase tracking-wider">Co chce dostać:</p>
          <p id="twish" class="whitespace-pre-wrap text-sm sm:text-base leading-relaxed"></p>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="fx.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let S = JSON.parse(localStorage.getItem('santa') || 'null');
const NOWISH = 'Ta osoba nie wpisała jeszcze swoich życzeń – czas na kreatywną niespodziankę!';

async function api(path, opt = {}) {
  const r = await fetch('/api/' + path, { ...opt, headers: { 'content-type': 'application/json', 'x-user': encodeURIComponent(S.name), 'x-pin': S.pin } });
  if (r.status === 401) { logout(); throw new Error('auth'); }
  return r.json();
}
function logout() { localStorage.removeItem('santa'); S = null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
function showTarget(t) {
  $('tname').textContent = t.name;
  $('twish').textContent = t.wish && t.wish.trim() ? t.wish : NOWISH;
  $('before').classList.add('hidden'); $('after').classList.remove('hidden');
}
async function load() {
  const me = await api('me');
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('hi').textContent = me.name; $('wish').value = me.wish;
  if (me.has_drawn && me.target) showTarget(me.target);
}
if (S) load().catch(() => {});
$('lbtn').onclick = async () => {
  const name = $('who').value.trim(), pin = $('pin').value.trim();
  $('lerr').textContent = '';
  if (!name || !/^\d{4}$/.test(pin)) return ($('lerr').textContent = 'Wpisz imię i 4-cyfrowy PIN');
  $('lbtn').disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, pin }) });
    const j = await r.json().catch(() => ({ error: 'Nieprawidłowa odpowiedź serwera (czy funkcje API zostały wdrożone?)' }));
    if (!r.ok) return ($('lerr').textContent = j.error || 'Błędne imię lub PIN');
    S = { name: j.name, pin }; localStorage.setItem('santa', JSON.stringify(S)); $('pin').value = ''; $('who').value = '';
    await load();
  } catch (e) {
    $('lerr').textContent = 'Błąd połączenia z serwerem';
  } finally { $('lbtn').disabled = false; }
};
['who', 'pin'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('lbtn').click(); }));
$('out').onclick = logout;
$('wbtn').onclick = async () => {
  await api('wish', { method: 'PUT', body: JSON.stringify({ wish: $('wish').value }) });
  $('wok').textContent = 'Zapisano ✓'; setTimeout(() => ($('wok').textContent = ''), 2000);
};
$('draw').onclick = async () => {
  $('draw').disabled = true; $('gift').classList.add('shake');
  const [res] = await Promise.all([api('reveal', { method: 'POST' }), new Promise((r) => setTimeout(r, 1100))]);
  $('gift').textContent = '🎉';
  setTimeout(() => { showTarget(res.target); $('after').classList.add('pop'); confetti(); }, 250);
};
</script>
</body>
</html>
